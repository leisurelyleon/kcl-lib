[package]
name = "kcl-diff-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Semantic diff engine for KCL (KittyCAD Language), built on Zoo's own kcl-lib parser."
repository = "https://github.com/<your-username>/kcl-diff"

[dependencies]
kcl-lib = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
