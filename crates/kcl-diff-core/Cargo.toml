[package]
name = "kcl-diff-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Semantic diff engine for KCL (KittyCAD Language), built on Zoo's own kcl-lib parser."
repository = "https://github.com/<your-username>/kcl-diff"

[lib]
# cdylib -> wasm-pack output; rlib -> native tests/binaries can link it.
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
kcl-lib = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# wasm-only (pulled in by the `wasm` feature)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
