[package]
name = "kcl-diff-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
kcl-diff-core = { path = "../kcl-diff-core" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
